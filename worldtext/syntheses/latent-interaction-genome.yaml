migration_map:
  - from: "time-on-task usability"
    to: "target fidelity under drift"
    reason: "Generative systems do not have one deterministic path to task completion."
    formal_shift: "Measure route quality, correction quality, and recovery rather than speed alone."

  - from: "error rate"
    to: "failure classification"
    reason: "Failures are diagnostic signals about model priors, context pressure, and constraint conflicts."
    formal_shift: "Treat misses as traceable categories: framing miss, context loss, style prior, safety intervention, drift, tool failure."

  - from: "static benchmark"
    to: "encounter trace"
    reason: "A single output cannot represent the live interaction between practitioner, prompt, model, and target."
    formal_shift: "Evaluate the full sequence of prompt, output, correction, comparison, and outcome."

  - from: "best prompt"
    to: "promptline"
    reason: "Templates pretend stable reuse; promptlines document navigable routes through unstable terrain."
    formal_shift: "Store route, landmarks, failure points, correction moves, and break conditions."

  - from: "user interview"
    to: "co-practice trace"
    reason: "Expert craft appears in timing, revision, branching, and repair, not just retrospective explanation."
    formal_shift: "Observe novices and experts live on the same target and compare traces."

  - from: "guardrail metaphor"
    to: "harness and flow-shaping"
    reason: "A generative system changes internally and cannot be governed only by edge-blocking."
    formal_shift: "Expose state, shape defaults, log provenance, throttle risk, and surface uncertainty."

  - from: "embodiment as body/interface coupling"
    to: "embodiment as iteration strain"
    reason: "In generative work, bodily engagement appears through rhythm, persistence, reversal, fatigue, and correction pressure."
    formal_shift: "Measure attempts, pauses, reformulations, rollback moments, and strategy shifts."

