title: "Latent Interaction Design"
seed: "Generative systems require steering, trace literacy, and correction craft rather than frictionless task completion."

ancestral_formalisms:
  key_sources:
    - "Norbert Wiener — cybernetics as control and communication in animal and machine"
    - "W. Ross Ashby — variety, feedback, and adaptive regulation"
    - "Gregory Bateson — difference that makes a difference; recursive context"
    - "Stafford Beer — viable systems and operational steering"
    - "Card, Moran, and Newell — cognitive HCI, GOMS, human information processing"
    - "Lucy Suchman — plans, situated action, and the limits of procedural models"
    - "Winograd and Flores — language/action perspective and breakdown as design material"
    - "Paul Dourish — embodied interaction and meaning as situated practice"
    - "Clifford Geertz — thick description as contextual interpretation of action"
    - "Bødker — first, second, and third-wave HCI"
    - "Harrison, Sengers, and Tatar — third paradigm HCI"
    - "Wobbrock and Kientz — expanded research contributions in HCI"
    - "Research through Design — artifact-making as knowledge production"
    - "Posthuman and more-than-human design — decentering the bounded human user"
    - "LLM practice — prompt engineering, context engineering, model drift, trace comparison"
  inherited_lessons:
    - "A system is not understood by asking users what they remember; it is understood by observing how action unfolds."
    - "Context is not background; context is an active constraint field."
    - "Breakdown is not noise; breakdown reveals the operating structure."
    - "Embodiment appears in rhythm, strain, correction, fatigue, and repeated contact."
    - "Interaction with generative models is not command execution; it is navigation through probabilistic response surfaces."
    - "The new craft object is not the interface screen but the logged encounter trace."
  governing_impressions:
    - "The model as ocean, not menu"
    - "The prompt as rudder, not query"
    - "The user as practitioner, not consumer"
    - "The interface as instrument panel, not wrapper"
    - "The output as landmark, not final answer"
    - "The promptline as route through drift"

origin_conditions:
  first_problem_statements:
    - "Why do traditional usability metrics fail when applied to generative AI systems?"
    - "How can HCI study skilled prompting without reducing it to interviews or vague best practices?"
    - "What is the correct unit of analysis for relational interaction with probabilistic systems?"
    - "How do we design instruments that support steering under drift?"
    - "How can thick description become thick prompting?"
    - "How can context engineering become an HCI research method rather than a folk practice?"
  first_representations:
    - "encounter trace"
    - "promptline"
    - "response surface"
    - "correction path"
    - "failure cluster"
    - "model drift map"
    - "version comparison"
    - "context window pressure graph"
    - "target-output fidelity map"
    - "operator intervention sequence"
  first_invariants:
    - "Never evaluate a generative session by final output alone."
    - "Always record prompt, output, correction, model state, timestamp, and outcome."
    - "A prompt is meaningful by use, not by abstract wording."
    - "A reusable prompt is weaker than a documented route."
    - "Failure must remain visible because failure reveals the medium."
    - "The practitioner must be able to detect resistance, correct course, and explain the correction."
    - "No interface should conceal variables required for steering."
  first_bottlenecks:
    - "model drift"
    - "hidden system prompts"
    - "context loss"
    - "opaque safety interventions"
    - "non-deterministic retries"
    - "thin prompt templates"
    - "unlogged expert craft"
    - "usability metrics built for deterministic software"
    - "interfaces that hide model state"
    - "research methods that privilege retrospective testimony over live traces"
  first_failed_approaches:
    - "asking users whether the AI felt useful"
    - "treating prompt engineering as a bag of static tips"
    - "hiding model controls behind polished wrappers"
    - "measuring task completion without recording correction paths"
    - "treating expert prompting as personality or taste rather than observable craft"
    - "using interviews instead of live co-practice"
    - "governing generative media only with guardrail metaphors"
  first_signals:
    - "experts and novices produce different correction sequences under the same model and target"
    - "outputs vary across retries even when prompts are identical"
    - "successful prompts decay after model updates"
    - "high-quality results often emerge through failure classification, not initial instruction"
    - "users overtrust when system state is hidden"
    - "the most meaningful interaction happens in revision, not first generation"

