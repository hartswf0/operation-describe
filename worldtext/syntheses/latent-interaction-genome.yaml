signature_construction_ecology:
  problem_logic: "The central problem is that generative AI interaction cannot be evaluated as deterministic task completion because the medium itself drifts, responds variably, and requires active steering."
  representation_logic: "The world is encoded as traces: prompt, output, correction, failure, retry, branch, model state, target, and outcome."
  invariant_logic: "A generative interaction is not understood unless its correction sequence is visible."
  method_logic: "Progress comes from entering the model, setting resistant targets, recording live practice, comparing routes, and retesting under drift."
  proof_logic: "Correctness is not proven by one successful output but by route durability, recoverability, and comparative trace evidence."
  implementation_logic: "Build trace instruments that capture prompts, outputs, branches, diffs, model metadata, failure classifications, and route replays."
  optimization_logic: "Optimize not for speed alone, but for steerability, recoverability, failure legibility, and preservation of operator judgment."
  evaluation_logic: "Evaluate target fidelity, route clarity, correction quality, drift awareness, and whether another skilled practitioner can traverse or retest the route."
  generalization_logic: "The method transfers to domains where outputs emerge through iterative prompting under unstable model conditions; it breaks when hidden systems prevent trace capture."
  elegance_logic: "The elegant move is replacing the fantasy of the best prompt with the craft reality of the working path."
  interface_logic: "Interfaces should expose the variables required for steering: model version, context pressure, retries, variation, tool calls, constraints, provenance, and failure history."
  intervention_logic: "This framework changes HCI from usability testing of finished surfaces into cybernetic study of live human-model encounters."

